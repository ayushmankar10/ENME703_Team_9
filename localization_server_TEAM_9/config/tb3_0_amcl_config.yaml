/tb3_0/amcl:
  ros__parameters:
    use_sim_time: true

    global_frame_id: "map"
    odom_frame_id: "tb3_0/odom"
    base_frame_id: "tb3_0/base_footprint"
    scan_topic: "/tb3_0/scan"
    map_topic: "/map"

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    laser_model_type: "likelihood_field"
    laser_min_range: -1.0
    laser_max_range: 100.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60

    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1

    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    min_particles: 200
    max_particles: 1000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    update_min_d: 0.05
    update_min_a: 0.05
    transform_tolerance: 1.0
    tf_broadcast: true
    save_pose_rate: 0.5

    set_initial_pose: false