tb407/bt_navigator:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: true
    global_frame: "map"
    robot_base_frame: "tb407/base_link"
    odom_topic: "/tb407/odom"
    bt_loop_duration: 10
    default_server_timeout: 20

    # The launch file supplies default_nav_to_pose_bt_xml.
    navigators: ["navigate_to_pose"]

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      enable_groot_monitoring: false