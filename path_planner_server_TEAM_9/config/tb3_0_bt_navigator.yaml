tb3_0/bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: tb3_0/base_footprint
    odom_topic: /tb3_0/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
      enable_groot_monitoring: false
